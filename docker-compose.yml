services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: neuroforge
      POSTGRES_USER: neuroforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - neuroforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroforge -d neuroforge"]
      interval: 5s
      retries: 15
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/neuroforge-realm.json:/opt/keycloak/data/import/neuroforge-realm.json:ro
volumes:
  neuroforge_pg:
